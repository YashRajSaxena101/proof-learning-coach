<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Proof companion — original vector character</title><style>.proof-avatar {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 7px 12px #06142555);
}
.proof-avatar-body {
  transform-origin: 90px 175px;
  animation: proof-bob 4s ease-in-out infinite;
}
.proof-avatar-eyes {
  animation: proof-blink 6.2s infinite;
}
.proof-avatar-head {
  transform-origin: 90px 120px;
}
.proof-avatar-flame {
  transform-origin: 88px 58px;
  animation: proof-fire 2s ease-in-out infinite alternate;
}
.proof-avatar[data-mood="happy"] .proof-avatar-body {
  animation:
    proof-bounce 0.65s ease-in-out 3,
    proof-bob 4s 2s ease-in-out infinite;
}
.proof-avatar[data-mood="happy"] .proof-avatar-arm-right {
  transform-origin: 119px 144px;
  animation: proof-wave 0.5s ease-in-out 4;
}
.proof-avatar[data-mood="sad"] .proof-avatar-head {
  transform: rotate(-7deg) translateY(4px);
}
.proof-avatar[data-mood="sad"] .proof-avatar-body {
  animation: proof-bob 6s ease-in-out infinite;
}
.proof-avatar[data-mood="bored"] .proof-avatar-pupils {
  animation: proof-glance 4s ease-in-out infinite;
}
.proof-avatar[data-mood="bored"] .proof-avatar-head {
  transform: rotate(6deg);
}
.proof-avatar[data-mood="talking"] .proof-avatar-arm-right {
  transform-origin: 119px 144px;
  animation: proof-wave 1.2s ease-in-out infinite;
}
.proof-avatar[data-mood="talking"] .proof-avatar-mouth {
  transform-origin: 91px 115px;
  animation: proof-talk 0.4s ease-in-out infinite alternate;
}
.proof-avatar[data-mood="asleep"] .proof-avatar-body {
  animation: proof-breathe 4s ease-in-out infinite;
}
.proof-avatar[data-mood="asleep"] .proof-avatar-head {
  transform: rotate(9deg) translateY(6px);
}
.proof-avatar[data-mood="asleep"] .proof-avatar-eyes {
  animation: none;
}
.proof-avatar-zzz {
  animation: proof-snooze 3s ease-in-out infinite;
}
.proof-avatar[data-motion="off"] *,
html.motion-paused .proof-avatar * {
  animation: none !important;
  transition: none !important;
}
@keyframes proof-bob {
  50% {
    transform: translateY(-5px) rotate(1deg);
  }
}
@keyframes proof-blink {
  0%,
  44%,
  47%,
  100% {
    transform: scaleY(1);
  }
  45%,
  46% {
    transform: scaleY(0.06);
  }
}
@keyframes proof-fire {
  to {
    transform: rotate(3deg) scaleY(1.05);
  }
}
@keyframes proof-bounce {
  40% {
    transform: translateY(-12px) rotate(-3deg);
  }
  70% {
    transform: translateY(1px) scaleY(0.97);
  }
}
@keyframes proof-wave {
  50% {
    transform: rotate(-20deg);
  }
}
@keyframes proof-glance {
  40%,
  65% {
    transform: translateX(-3px);
  }
}
@keyframes proof-talk {
  to {
    transform: scaleY(0.55);
  }
}
@keyframes proof-breathe {
  50% {
    transform: translateY(2px) scaleY(1.02);
  }
}
@keyframes proof-snooze {
  50% {
    opacity: 0.4;
    transform: translateY(-7px);
  }
}
.proof-companion {
  position: fixed;
  right: max(16px, env(safe-area-inset-right));
  bottom: calc(78px + env(safe-area-inset-bottom));
  z-index: 45;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  font-family: var(--font-sans, system-ui);
}
.proof-companion-launcher {
  position: relative;
  width: 92px;
  height: 118px;
  border: 0;
  background: transparent;
  cursor: pointer;
  padding: 0;
  border-radius: 24px;
}
.proof-companion-launcher:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 4px;
}
.proof-companion-name {
  position: absolute;
  bottom: -3px;
  left: 22px;
  right: 15px;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 999px;
  padding: 3px 7px;
  font-size: 11px;
  color: var(--foreground);
}
.proof-companion-bubble {
  max-width: 245px;
  padding: 13px 16px;
  border: 1px solid var(--border);
  border-radius: 18px 18px 4px 18px;
  background: var(--card);
  box-shadow: 0 12px 40px #0003;
  color: var(--foreground);
  font-size: 13px;
  line-height: 1.6;
  margin: 0 18px 6px 0;
  overflow-wrap: anywhere;
}
.proof-companion-panel {
  width: min(360px, calc(100vw - 32px));
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--background);
  box-shadow: 0 18px 70px #0007;
  margin-bottom: 8px;
  overflow: hidden;
  color: var(--foreground);
}
.proof-companion-panel-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.proof-companion-panel-head strong {
  font-size: 16px;
}
.proof-companion-controls {
  display: flex;
  margin-left: auto;
  gap: 4px;
}
.proof-companion-icon {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted-foreground);
  cursor: pointer;
}
.proof-companion-icon:hover {
  background: var(--muted);
  color: var(--foreground);
}
.proof-companion-conversation {
  max-height: min(35dvh, 270px);
  overflow-y: auto;
  padding: 16px;
  overscroll-behavior: contain;
}
.proof-companion-line {
  font-size: 14px;
  line-height: 1.65;
  overflow-wrap: anywhere;
  margin-bottom: 14px;
}
.proof-companion-line small {
  display: block;
  color: var(--teal);
  font-size: 11px;
  margin-bottom: 4px;
}
.proof-companion-line[data-role="user"] {
  padding-left: 14px;
  border-left: 2px solid var(--border);
}
.proof-companion-form {
  border-top: 1px solid var(--border);
  padding: 14px 16px;
}
.proof-companion-form label {
  font-size: 12px;
  color: var(--muted-foreground);
}
.proof-companion-form textarea {
  width: 100%;
  margin-top: 7px;
  padding: 10px 12px;
  resize: vertical;
  max-height: 120px;
  min-height: 72px;
  border: 1px solid var(--input);
  border-radius: 10px;
  background: var(--card);
  color: var(--foreground);
  font-size: 16px;
  line-height: 1.5;
}
.proof-companion-form button {
  min-height: 44px;
  border-radius: 999px;
  padding: 8px 16px;
  margin-top: 9px;
  background: var(--teal);
  color: var(--background);
  font-size: 13px;
  font-weight: 600;
  border: 0;
  cursor: pointer;
}
.proof-companion-form button:disabled {
  opacity: 0.5;
  cursor: default;
}
.proof-companion-meta {
  font-size: 11px;
  line-height: 1.5;
  color: var(--muted-foreground);
}
.proof-companion-error {
  font-size: 13px;
  color: var(--warn);
  line-height: 1.5;
  margin: 8px 0;
}
.proof-companion-restore {
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--card);
  color: var(--muted-foreground);
  padding: 10px 14px;
  min-height: 44px;
  font-size: 12px;
  cursor: pointer;
}
@media (max-width: 639px) {
  .proof-companion {
    right: 12px;
    bottom: calc(94px + env(safe-area-inset-bottom));
  }
  .proof-companion-launcher {
    width: 77px;
    height: 99px;
  }
  .proof-companion-name {
    left: 16px;
    right: 10px;
    font-size: 10px;
  }
  .proof-companion-panel {
    max-height: calc(100dvh - 230px);
    overflow-y: auto;
  }
  .proof-companion-bubble {
    max-width: min(230px, calc(100vw - 110px));
    font-size: 12px;
  }
  .proof-companion-icon {
    width: 44px;
    height: 44px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .proof-avatar * {
    animation: none !important;
    transition: none !important;
  }
}
